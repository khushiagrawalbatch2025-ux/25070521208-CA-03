<a class="card" href="{% url 'product' p.slug %}">
  <div class="shot" style="--c:{{ p.color }}">
    {% if p.image_url %}<img src="{{ p.image_url }}" alt="{{ p.name }}" loading="lazy">
    {% else %}<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M30 12 10 26l10 18 10-6v52h40V38l10 6 10-18L70 12c-4 8-12 12-20 12s-16-4-20-12z"/></svg>{% endif %}
    {% if p.badge %}<span class="tag">{{ p.badge }}</span>{% endif %}
    {% if p.stock == 0 %}<span class="tag out">Sold out</span>{% endif %}
  </div>
  <h3>{{ p.name }}</h3>
  <p>₹{{ p.price|floatformat:0 }}</p>
</a>
