{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}NEEL: indigo-dyed everyday clothing{% endblock %}</title>
<meta name="description" content="NEEL makes shirts, tees, trousers and layers dyed in indigo and cut to last.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header class="top">
  <a class="logo" href="{% url 'home' %}">NEEL</a>
  <button class="menu" aria-label="Menu" aria-expanded="false">Menu</button>
  <nav id="nav">
    <a href="{% url 'shop' %}">All clothing</a>
    <a href="{% url 'shop' %}?cat=shirts">Shirts</a>
    <a href="{% url 'shop' %}?cat=tees">Tees</a>
    <a href="{% url 'shop' %}?cat=trousers">Trousers</a>
    <a href="{% url 'shop' %}?cat=layers">Layers</a>
  </nav>
  <a class="bag" href="{% url 'bag' %}">Bag <b id="count">{{ cart_count }}</b></a>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
  <p class="logo">NEEL</p>
  <p>Free shipping on orders above ₹2,999. Easy 15-day returns.</p>
  <p>hello@neel.example</p>
</footer>
<div id="toast" role="status" aria-live="polite"></div>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
